.flower-sway:nth-of-type(even){animation-duration:5.1s;animation-delay:7.4s;}
@keyframes balanceo{0%{rotate:-4deg}50%{rotate:2deg}100%{rotate:5deg}}
.foliage{transform-box:fill-box;transform-origin:50% 100%;animation:hojasBrisa 6s ease-in-out 7s infinite alternate!important;}
@keyframes hojasBrisa{from{rotate:-1deg}to{rotate:1deg}}

<button id="botonMusica" type="button" aria-label="Activar o pausar música">🎵 Activar música</button>
<style>#botonMusica{position:fixed;right:18px;bottom:20px;z-index:1000;border:1px solid #ffc4e8;border-radius:28px;background:#b82f80;color:white;padding:12px 18px;box-shadow:0 0 18px #ed5bab;font:600 14px Arial;cursor:pointer}</style>
<script>
const musica=document.getElementById('musica');
const boton=document.getElementById('botonMusica');
async function iniciarMusica(){
  try{await musica.play();boton.textContent='⏸ Pausar música';}
  catch(e){boton.textContent='🎵 Activar música';}
}
boton.addEventListener('click',async()=>{
  if(musica.paused){await iniciarMusica();}
  else{musica.pause();boton.textContent='🎵 Reproducir música';}
});
window.addEventListener('DOMContentLoaded',iniciarMusica);
window.addEventListener('load',iniciarMusica);
</script>
